<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PitchSwipe</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; text-align: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #f8fafc; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; }
  p { margin: 0 0 20px; opacity: .8; }
  button { font: inherit; font-weight: 600; padding: 12px 24px; border: 0; border-radius: 999px;
    background: #f8fafc; color: #0f172a; min-height: 44px; }
  .spin { width: 28px; height: 28px; margin: 0 auto 16px; border: 3px solid rgba(248,250,252,.25);
    border-top-color: #f8fafc; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>PitchSwipe</h1>
  <div id="loading"><div class="spin" role="status" aria-label="Loading"></div><p>Connecting&hellip;</p></div>
  <div id="offline" hidden>
    <p id="msg">Can't reach PitchSwipe. Check your connection and try again.</p>
    <button id="retry" type="button">Retry</button>
  </div>
</main>
<script>
  // Shown only if the native shell could not load server.url (offline, or no URL configured at sync time).
  var loading = document.getElementById('loading'), offline = document.getElementById('offline');
  function show() { loading.hidden = true; offline.hidden = false; }
  setTimeout(show, 4000);
  document.getElementById('retry').addEventListener('click', function () {
    offline.hidden = true; loading.hidden = false; setTimeout(function () { location.reload(); }, 600);
    setTimeout(show, 4000);
  });
</script>
</body>
</html>
