<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>Offline - PitchSwipe</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
    background:#fff;color:#0b0b0b;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
  main{max-width:22rem}
  h1{font-size:1.5rem;margin:0 0 .5rem}
  p{color:#5c5c5c;margin:0 0 1.25rem;line-height:1.5}
  button{background:#0b0b0b;color:#fff;border:0;border-radius:.75rem;padding:.75rem 1.25rem;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>PitchSwipe needs a connection to load your pitches and results. Check your network and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
